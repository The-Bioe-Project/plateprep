<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ocean-950:#06232C;--ocean-900:#0A2F3A;--ocean-800:#0E3E4C;--ocean-600:#176578;--ocean-500:#1E7D91;--ocean-400:#4CA0B2;--ocean-300:#84BFCC;--ocean-100:#DCEEF2;--ocean-50:#EFF7F9;--paper-50:#FBF9F5;--algae-500:#4E9346}
*{box-sizing:border-box}body{margin:0;background:#ffffff;padding:0}html{zoom:2}
.banner{width:1280px;height:400px;background:var(--ocean-900);position:relative;overflow:hidden;font-family:'Sora',sans-serif;border-radius:16px}
.bands{position:absolute;left:0;right:0;bottom:0}
.bands div{width:100%}
.b50{height:14px;background:var(--ocean-50)}.b100{height:14px;background:var(--ocean-100)}.b300{height:16px;background:var(--ocean-300)}.b600{height:20px;background:var(--ocean-600)}
.wrap{position:absolute;left:72px;top:64px;right:72px}
.eyebrow{font:500 13px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ocean-300);margin-bottom:22px}
.mark{font:800 96px/1 'Sora',sans-serif;letter-spacing:-0.02em;color:#fff}
.mark span{color:var(--ocean-300)}
.tag{font:400 24px/1.35 'Atkinson Hyperlegible',sans-serif;color:var(--ocean-100);margin-top:22px;max-width:900px}
.meta{position:absolute;right:72px;top:64px;text-align:right;font:500 13px/1.6 'IBM Plex Mono',monospace;color:var(--ocean-400)}
.meta b{display:block;color:var(--ocean-300);font-weight:500}
</style></head><body>
<div class="banner">
  <div class="wrap">
    <div class="eyebrow">Bioē · Institute of Biology · Unicamp</div>
    <div class="mark">Plate<span>Prep</span></div>
    <div class="tag">From field photographs to annotation-ready settlement-plate imagery — single-file, bilingual, runs in the browser.</div>
  </div>
  <div class="meta"><b>v1.0.4</b>CC BY 4.0<br>FAPESP #2025/0787809</div>
  <div class="bands"><div class="b600"></div><div class="b300"></div><div class="b100"></div><div class="b50"></div></div>
</div>
</body></html>
