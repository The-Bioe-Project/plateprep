<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ocean-900:#0A2F3A;--ocean-600:#176578;--ocean-400:#4CA0B2;--ocean-300:#84BFCC;--ocean-100:#DCEEF2;--ocean-50:#EFF7F9;--paper-50:#FBF9F5}
*{box-sizing:border-box}body{margin:0;background:#ffffff;padding:0}html{zoom:2}
.f{width:1280px;height:150px;position:relative;overflow:hidden;border-radius:16px;font-family:'Sora',sans-serif;background:var(--ocean-900)}
.bands{position:absolute;left:0;right:0;top:0}.bands div{width:100%}
.b50{height:10px;background:var(--ocean-50)}.b100{height:10px;background:var(--ocean-100)}.b300{height:12px;background:var(--ocean-300)}.b600{height:14px;background:var(--ocean-600)}
.row{position:absolute;left:56px;right:56px;top:46px;bottom:0;display:flex;align-items:center;justify-content:space-between}
.wm{font:800 40px/1 'Sora',sans-serif;letter-spacing:-0.02em;color:#fff}.wm span{color:var(--ocean-300)}
.wm small{display:block;font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ocean-400);margin-top:10px}
.chips{display:flex;gap:10px}
.chip{font:500 13px 'IBM Plex Mono',monospace;color:var(--ocean-100);border:1px solid var(--ocean-600);border-radius:6px;padding:8px 12px}
</style></head><body>
<div class="f">
  <div class="bands"><div class="b50"></div><div class="b100"></div><div class="b300"></div><div class="b600"></div></div>
  <div class="row">
    <div class="wm">Bio<span>ē</span><small>Institute of Biology · Unicamp · with CEBIMar/USP</small></div>
    <div class="chips"><div class="chip">FAPESP · #2025/0787809</div><div class="chip">PROASA</div><div class="chip">CC BY 4.0</div></div>
  </div>
</div>
</body></html>
